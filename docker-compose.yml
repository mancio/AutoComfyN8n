services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-love-comfy
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_TUNNEL_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - N8N_USER_MANAGEMENT_DISABLED=false
      - N8N_BASIC_AUTH_ACTIVE=false
    volumes:
      - ./n8n_data:/home/node/.n8n
    networks:
      - n8n-love-comfy-network
    restart: on-failure:5

  comfyui:
    build:
      context: .
      dockerfile: Dockerfile.comfyui
    container_name: comfyui-love-comfy
    ports:
      - "8188:8188"
    volumes:
      - ./comfyui/models:/comfyui/models
      - ./comfyui/output:/comfyui/output
      - ./comfyui/input:/comfyui/input
      - ./comfyui/user:/comfyui/user
    networks:
      - n8n-love-comfy-network
    restart: on-failure:5
    environment:
      - CUDA_VISIBLE_DEVICES=""
    # Uncomment the line below if you want to use GPU (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  n8n-love-comfy-network:
    driver: bridge

volumes:
  n8n_data:
    driver: local
  comfyui_models:
    driver: local
  comfyui_output:
    driver: local
